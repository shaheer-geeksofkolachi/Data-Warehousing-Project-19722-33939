apiVersion: 1
datasources:
  - name: SDI Postgres (ops metrics)
    uid: sdi-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: ${SDI_PG_HOST}:5432
    user: ${SDI_PG_USER}
    isDefault: true
    jsonData:
      database: pharma_sdi
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${SDI_PG_PASSWORD}
